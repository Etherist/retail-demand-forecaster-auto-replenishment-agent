name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -r requirements.txt

    - name: Generate sample data
      run: |
        uv run python scripts/generate_sample_data.py

    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v --tb=short

    - name: Upload coverage to Codecov (optional)
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and test Docker images
      run: |
        docker compose build
        docker compose up -d
        sleep 10
        docker compose ps
        docker compose exec -T app python -m pytest tests/ -v --tb=short || true
        docker compose down

  deploy-k8s-manifest:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4

    - name: Validate Kubernetes manifests
      run: |
        # Check if kubectl is available
        if command -v kubectl &> /dev/null; then
          kubectl apply --dry-run=client -f k8s/ || true
        else
          echo "kubectl not available, skipping manifest validation"
        fi
        # Validate YAML syntax
        python -c "import yaml; import os; [yaml.safe_load(open(os.path.join('k8s', f))) for f in os.listdir('k8s') if f.endswith('.yaml')]"
        echo "Kubernetes manifests are valid"
