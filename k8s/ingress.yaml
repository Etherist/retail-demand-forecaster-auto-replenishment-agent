apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-forecaster-ingress
  namespace: retail-forecaster
  labels:
    app: retail-forecaster
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: forecaster.retail.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retail-forecaster-service
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-mock-api-ingress
  namespace: retail-forecaster
  labels:
    app: retail-mock-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: mock-api.retail.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retail-mock-api
                port:
                  number: 8001
