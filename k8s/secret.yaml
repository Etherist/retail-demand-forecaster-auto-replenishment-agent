apiVersion: v1
kind: Secret
metadata:
  name: retail-forecaster-secrets
  namespace: retail-forecaster
  labels:
    app: retail-forecaster
type: Opaque
stringData:
  # SMTP credentials - replace with actual values
  SMTP_USER: "forecaster@retail.com"
  SMTP_PASSWORD: "your-smtp-password"
  # Database credentials (if using)
  DB_HOST: "postgres.retail-forecaster.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "retail_db"
  DB_USER: "retail_user"
  DB_PASSWORD: "retail_password"
