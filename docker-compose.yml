version: '3.8'

services:
  app:
    build: .
    container_name: retail-forecaster-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - SUPPLIER_API_BASE_URL=http://mock-api:8001
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ./reports:/app/reports
      - ./src/data:/app/src/data
    depends_on:
      - mock-api
    networks:
      - retail-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    container_name: retail-mock-api
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    networks:
      - retail-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: retail-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - retail-network
  #   restart: unless-stopped

networks:
  retail-network:
    driver: bridge
    name: retail_forecaster_net

volumes:
  reports:
  data:
